<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Guardias en Tiempo Real</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: Arial, sans-serif; padding: 25px; }
    .panel-card { border-radius: 10px; background-color: #1e293b; border: 1px solid #334155; }
    .table { color: #f8fafc; }
    .clock-box { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-0 text-white font-weight-bold">PANEL DE GUARDIAS VIGENTES</h2>
      <small class="text-secondary">Hospital - Visualización en Tiempo Real</small>
    </div>
    <div class="d-flex align-items-center gap-3">
      <a href="cargar.html" class="btn btn-outline-info btn-sm">➕ Cargar Guardia</a>
      <div id="reloj" class="clock-box"></div>
    </div>
  </div>

  <div class="row g-4">
    <!-- Columna Guardias Activas -->
    <div class="col-md-6">
      <div class="card panel-card p-3">
        <h4 class="text-success mb-3">● Guardias Activas Presenciales</h4>
        <table class="table table-dark table-hover">
          <thead>
            <tr class="text-secondary">
              <th>Servicio</th>
              <th>Profesional</th>
              <th>Interno / Contacto</th>
            </tr>
          </thead>
          <tbody id="tablaActivas">
            <tr><td colspan="3" class="text-center text-muted">Cargando guardias...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Columna Guardias Pasivas -->
    <div class="col-md-6">
      <div class="card panel-card p-3">
        <h4 class="text-info mb-3">● Guardias Pasivas Activas Ahora</h4>
        <table class="table table-dark table-hover">
          <thead>
            <tr class="text-secondary">
              <th>Servicio Operativo/Apoyo</th>
              <th>Responsable</th>
              <th>Interno / Contacto</th>
            </tr>
          </thead>
          <tbody id="tablaPasivas">
            <tr><td colspan="3" class="text-center text-muted">Cargando pasivas...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/logica.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
