<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carga de Guardias</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-dark-theme text-light">

  <div class="container py-5">
    <div class="card bg-panel border-secondary shadow mx-auto form-container">
      <div class="card-header bg-transparent border-secondary py-3 d-flex justify-content-between align-items-center">
        <h4 class="text-info mb-0">Carga de Asignación de Guardia</h4>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">⬅ Volver al Panel</a>
      </div>

      <div class="card-body p-4">
        <form id="formGuardia">
          <div class="mb-3">
            <label class="form-label text-secondary">Servicio:</label>
            <select class="form-select bg-dark text-light border-secondary" id="servicio" required>
              <option value="">Seleccione un servicio...</option>
              <optgroup label="Guardias Pasivas">
                <option value="Sistemas" data-tipo="Pasiva" data-modo="semanal">Sistemas (L a L 15 a 07hs)</option>
                <option value="Electromedicina" data-tipo="Pasiva" data-modo="semanal">Electromedicina (L a L 13 a 07hs)</option>
                <option value="Farmacia" data-tipo="Pasiva" data-modo="semanal">Farmacia (L a L 16 a 07hs)</option>
                <option value="Instrumentadoras" data-tipo="Pasiva" data-modo="semanal">Instrumentadoras (L a L 22 a 07hs)</option>
                <option value="Esterilizacion" data-tipo="Pasiva" data-modo="finde">Esterilización (Vie 22hs a Lun 06hs)</option>
                <option value="Anestesia" data-tipo="Pasiva" data-modo="finde">Anestesia (Vie 00hs a Lun 06hs)</option>
                <option value="Hemoterapia" data-tipo="Pasiva" data-modo="semanal">Hemoterapia Pasiva</option>
                <option value="RX Quirofano" data-tipo="Pasiva" data-modo="semanal">RX Quirófano Pasiva</option>
              </optgroup>
              <optgroup label="Guardias Activas Presenciales">
                <option value="Guardia externa Adultos" data-tipo="Activa" data-modo="diaria">Guardia externa Adultos</option>
                <option value="Guardia externa Pediatrica" data-tipo="Activa" data-modo="diaria">Guardia externa Pediátrica</option>
                <option value="Neonatologia" data-tipo="Activa" data-modo="diaria">Neonatología</option>
                <option value="Cirugia General" data-tipo="Activa" data-modo="diaria">Cirugía General</option>
                <option value="Traumatologia" data-tipo="Activa" data-modo="diaria">Traumatología</option>
                <option value="Urologia" data-tipo="Activa" data-modo="diaria">Urología</option>
                <option value="Cardiologia/Unidad Coronaria" data-tipo="Activa" data-modo="diaria">Cardiología / UCO</option>
                <option value="Laboratorio" data-tipo="Activa" data-modo="diaria">Laboratorio</option>
              </optgroup>
            </select>
          </div>

          <div class="mb-3" id="campoModalidad" style="display:none;">
            <label class="form-label text-secondary">Modalidad / Carga:</label>
            <select class="form-select bg-dark text-light border-secondary" id="modalidad"></select>
          </div>

          <div class="row mb-3">
            <div class="col">
              <label class="form-label text-secondary" id="lblFechaInicio">Fecha:</label>
              <input type="date" class="form-control bg-dark text-light border-secondary" id="fechaInicio" required>
            </div>
            <div class="col" id="colFechaFin" style="display:none;">
              <label class="form-label text-secondary">Fecha Fin:</label>
              <input type="date" class="form-control bg-dark text-light border-secondary" id="fechaFin">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary">Profesional / Responsable:</label>
            <input type="text" class="form-control bg-dark text-light border-secondary" id="responsable" placeholder="Apellido y Nombre" required>
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary">Teléfono / Interno:</label>
            <input type="text" class="form-control bg-dark text-light border-secondary" id="contacto" placeholder="Ej: Int 1420 / 291-..." required>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btnGuardar">Registrar Guardia</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/formulario.js"></script>
</body>
</html>
